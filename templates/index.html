<!DOCTYPE html>
<html>
<head>
    <title>{{ web_title }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: {{ color_background }};
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .controls {
            padding: {{ controls_padding }};
            background: {{ color_controls_bg }};
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { color: {{ color_text_light }}; font-size: 0.9rem; font-weight: 500; }
        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: {{ color_select_bg }};
            min-width: 150px;
            cursor: pointer;
        }
        button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            background: {{ color_button }};
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: {{ color_button_hover }}; }
        #map { height: {{ map_height }}; width: 100%; background: #111; }
        
        .stats-panel {
            padding: 20px;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .stats-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
        }
        .area-info {
            color: white;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <div class="control-group">
            <label>Дата</label>
            <select id="date-select"><option value="">Выберите дату</option></select>
        </div>
        <div class="control-group">
            <label>Слой</label>
            <select id="layer-select"><option value="">Выберите слой</option></select>
        </div>
        <div class="control-group">
            <label>Прозрачность</label>
            <input type="range" id="opacity-slider" min="0" max="100" value="{{ default_opacity_percent }}">
        </div>
        <button id="apply-btn">Отобразить</button>
    </div>

    <div id="map"></div>

    {% if enable_compare %}
    <div class="controls">
        <div class="control-group">
            <label>Сравнение 1</label>
            <select id="compare-date-1"><option value="">Дата 1</option></select>
            <select id="compare-layer-1"><option value="">Слой 1</option></select>
        </div>
        <div class="control-group">
            <label>Сравнение 2</label>
            <select id="compare-date-2"><option value="">Дата 2</option></select>
            <select id="compare-layer-2"><option value="">Слой 2</option></select>
        </div>
        <button id="compare-btn">Сравнить статистику</button>
    </div>
    <div id="compare-results" class="stats-panel"></div>

    <div class="controls">
        <div class="control-group">
            <label>Сравнение по области</label>
            <button id="select-area-btn" style="background: #ff9800;">Выбрать область</button>
            <button id="clear-area-btn" style="background: #f44336;">Очистить</button>
        </div>
        <div id="area-info" class="area-info"></div>
    </div>
    <div id="compare-area-results" class="stats-panel" style="display: none;"></div>
    {% endif %}
</div>
<div class="loader" id="loader">Загрузка...</div>

<script>
    const map = L.map('map').setView({{ default_map_center }}, {{ default_map_zoom }});
    L.tileLayer('{{ default_base_tile_url }}', {
        attribution: '{{ default_base_attribution }}',
        maxZoom: {{ default_base_max_zoom }}
    }).addTo(map);

    let currentOverlay = null;
    let currentImageRequest = null;
    let drawControl = null;
    let drawnItems = null;
    let selectedBbox = null;

    const dateSelect = document.getElementById('date-select');
    const layerSelect = document.getElementById('layer-select');
    const opacitySlider = document.getElementById('opacity-slider');
    const applyBtn = document.getElementById('apply-btn');
    const loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    async function loadDates() {
        showLoader();
        try {
            const res = await fetch('/api/dates');
            const dates = await res.json();
            dates.forEach(date => {
                const opt = new Option(date, date);
                dateSelect.add(opt);
                {% if enable_compare %}
                document.getElementById('compare-date-1').add(new Option(date, date));
                document.getElementById('compare-date-2').add(new Option(date, date));
                {% endif %}
            });
        } catch (err) {
            console.error(err);
            alert('Ошибка загрузки дат');
        } finally {
            hideLoader();
        }
    }

    async function loadLayers(date, selectElement) {
        if (!date) return;
        showLoader();
        try {
            const res = await fetch(`/api/layers/${date}`);
            const layers = await res.json();
            selectElement.innerHTML = '<option value="">Выберите слой</option>';
            layers.forEach(l => {
                const opt = new Option(l.layer, l.layer);
                opt.dataset.bounds = JSON.stringify(l.bounds);
                opt.dataset.label = l.label;
                selectElement.add(opt);
            });
        } catch (err) {
            console.error(err);
            alert('Ошибка загрузки слоёв');
        } finally {
            hideLoader();
        }
    }

    async function loadImage() {
        const date = dateSelect.value;
        const layer = layerSelect.value;
        if (!date || !layer) return;
        
        if (currentImageRequest) {
            currentImageRequest.abort();
        }
        let controller;
        showLoader();
        try {
            const layersRes = await fetch(`/api/layers/${date}`);
            const layers = await layersRes.json();
            const layerInfo = layers.find(l => l.layer === layer);
            if (!layerInfo) throw new Error('Слой не найден');
            const boundsWGS84 = layerInfo.bounds;
            const imageBounds = [[boundsWGS84[1], boundsWGS84[0]], [boundsWGS84[3], boundsWGS84[2]]];
            
            if (currentOverlay) map.removeLayer(currentOverlay);
            
            const controller = new AbortController();
            currentImageRequest = controller;
            const imageUrl = `/api/image/${date}/${layer}`;
            const img = new Image();
            img.crossOrigin = "Anonymous";
            
            await new Promise((resolve, reject) => {
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
                img.src = imageUrl;
            });
            
            currentOverlay = L.imageOverlay(imageUrl, imageBounds, {
                opacity: opacitySlider.value / 100,
                interactive: true
            }).addTo(map);
            
            map.fitBounds(imageBounds);
        } catch (err) {
            if (err.name !== 'AbortError') {
                console.error(err);
                alert('Ошибка загрузки изображения: ' + err.message);
            }
        } finally {
            if (currentImageRequest === controller) currentImageRequest = null;
            hideLoader();
        }
    }

    dateSelect.addEventListener('change', (e) => loadLayers(e.target.value, layerSelect));
    applyBtn.addEventListener('click', loadImage);
    opacitySlider.addEventListener('input', () => {
        if (currentOverlay) currentOverlay.setOpacity(opacitySlider.value / 100);
    });

    loadDates();

    {% if enable_compare %}
    const compareDate1 = document.getElementById('compare-date-1');
    const compareLayer1 = document.getElementById('compare-layer-1');
    const compareDate2 = document.getElementById('compare-date-2');
    const compareLayer2 = document.getElementById('compare-layer-2');
    const compareBtn = document.getElementById('compare-btn');
    const compareResults = document.getElementById('compare-results');

    compareDate1.addEventListener('change', (e) => loadLayers(e.target.value, compareLayer1));
    compareDate2.addEventListener('change', (e) => loadLayers(e.target.value, compareLayer2));

    async function performCompare() {
        const date1 = compareDate1.value;
        const layer1 = compareLayer1.value;
        const date2 = compareDate2.value;
        const layer2 = compareLayer2.value;
        if (!date1 || !layer1 || !date2 || !layer2) {
            alert('Пожалуйста, выберите обе пары (дата + слой)');
            return;
        }
        showLoader();
        try {
            const response = await fetch('/api/compare', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date1, layer1, date2, layer2 })
            });
            const data = await response.json();
            compareResults.innerHTML = '';
            const card1 = document.createElement('div');
            card1.className = 'stats-card';
            const card2 = document.createElement('div');
            card2.className = 'stats-card';
            card1.innerHTML = `<h3>${data.layer1.label} (${data.layer1.date})</h3>`;
            card2.innerHTML = `<h3>${data.layer2.label} (${data.layer2.date})</h3>`;
            const stats1 = data.layer1.statistics;
            const stats2 = data.layer2.statistics;
            card1.innerHTML += `
                <p>Min: ${stats1.min?.toFixed(4) ?? '—'}</p>
                <p>Max: ${stats1.max?.toFixed(4) ?? '—'}</p>
                <p>Mean: ${stats1.mean?.toFixed(4) ?? '—'}</p>
                <p>StdDev: ${stats1.stddev?.toFixed(4) ?? '—'}</p>
            `;
            card2.innerHTML += `
                <p>Min: ${stats2.min?.toFixed(4) ?? '—'}</p>
                <p>Max: ${stats2.max?.toFixed(4) ?? '—'}</p>
                <p>Mean: ${stats2.mean?.toFixed(4) ?? '—'}</p>
                <p>StdDev: ${stats2.stddev?.toFixed(4) ?? '—'}</p>
            `;
            if ({{ show_histograms | lower }}) {
                if (stats1.histogram && stats1.histogram.length) {
                    const canvas1 = document.createElement('canvas');
                    canvas1.width = 300;
                    canvas1.height = 150;
                    card1.appendChild(canvas1);
                    new Chart(canvas1, {
                        type: 'bar',
                        data: { labels: Array(stats1.histogram.length).fill(''), datasets: [{ label: 'Частота', data: stats1.histogram, backgroundColor: 'rgba(75,192,192,0.4)' }] },
                        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: 'white' } } } }
                    });
                }
                if (stats2.histogram && stats2.histogram.length) {
                    const canvas2 = document.createElement('canvas');
                    canvas2.width = 300;
                    canvas2.height = 150;
                    card2.appendChild(canvas2);
                    new Chart(canvas2, {
                        type: 'bar',
                        data: { labels: Array(stats2.histogram.length).fill(''), datasets: [{ label: 'Частота', data: stats2.histogram, backgroundColor: 'rgba(153,102,255,0.4)' }] },
                        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: 'white' } } } }
                    });
                }
            }
            compareResults.appendChild(card1);
            compareResults.appendChild(card2);
        } catch (err) {
            console.error(err);
            compareResults.innerHTML = '<div class="stats-card">Ошибка загрузки данных сравнения</div>';
        } finally {
            hideLoader();
        }
    }
    compareBtn.addEventListener('click', performCompare);

    // Сравнение по области
    const selectAreaBtn = document.getElementById('select-area-btn');
    const clearAreaBtn = document.getElementById('clear-area-btn');
    const areaInfoDiv = document.getElementById('area-info');
    const compareAreaResults = document.getElementById('compare-area-results');

    function enableAreaSelection() {
        if (drawnItems) map.removeLayer(drawnItems);
        drawnItems = L.featureGroup().addTo(map);
        drawControl = new L.Draw.Rectangle(map, {
            shapeOptions: { color: '#ff9800', weight: 2 }
        });
        drawControl.enable();
        
        map.once('draw:created', function(e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);
            const bounds = layer.getBounds();
            const west = bounds.getWest();
            const south = bounds.getSouth();
            const east = bounds.getEast();
            const north = bounds.getNorth();
            selectedBbox = [west, south, east, north];
            areaInfoDiv.innerHTML = `Область: ${west.toFixed(4)}, ${south.toFixed(4)} - ${east.toFixed(4)}, ${north.toFixed(4)}`;
            if (drawControl) drawControl.disable();
            // автоматически сравнить, если выбраны слои
            const date1 = compareDate1.value;
            const layer1 = compareLayer1.value;
            const date2 = compareDate2.value;
            const layer2 = compareLayer2.value;
            if (date1 && layer1 && date2 && layer2) {
                performAreaCompare();
            }
        });
    }

    function clearArea() {
        if (drawnItems) map.removeLayer(drawnItems);
        if (drawControl) drawControl.disable();
        selectedBbox = null;
        areaInfoDiv.innerHTML = '';
        compareAreaResults.style.display = 'none';
    }

    async function performAreaCompare() {
        const date1 = compareDate1.value;
        const layer1 = compareLayer1.value;
        const date2 = compareDate2.value;
        const layer2 = compareLayer2.value;
        if (!date1 || !layer1 || !date2 || !layer2) {
            alert('Выберите обе пары (дата + слой) для сравнения');
            return;
        }
        if (!selectedBbox) {
            alert('Сначала выберите область на карте');
            return;
        }
        showLoader();
        try {
            const response = await fetch('/api/compare-area', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date1, layer1, date2, layer2,
                    bbox: selectedBbox
                })
            });
            const data = await response.json();
            const stats = data.statistics;
            const imgSrc = data.image;
            
            compareAreaResults.innerHTML = `
                <div class="stats-card">
                    <h3>Разница: ${layer1} (${date1}) - ${layer2} (${date2})</h3>
                    <p>Min: ${stats.min.toFixed(4)}</p>
                    <p>Max: ${stats.max.toFixed(4)}</p>
                    <p>Mean: ${stats.mean.toFixed(4)}</p>
                    <p>StdDev: ${stats.stddev.toFixed(4)}</p>
                    <canvas id="diff-histogram" width="300" height="150" style="max-width:100%"></canvas>
                    <img src="${imgSrc}" style="max-width:100%; margin-top:10px; border:1px solid #ccc;" />
                </div>
            `;
            const ctx = document.getElementById('diff-histogram').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Array(stats.histogram.length).fill(''),
                    datasets: [{ label: 'Частота разницы', data: stats.histogram, backgroundColor: 'rgba(255,99,132,0.4)' }]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: 'white' } } } }
            });
            compareAreaResults.style.display = 'grid';
        } catch (err) {
            console.error(err);
            alert('Ошибка при сравнении областей: ' + err.message);
        } finally {
            hideLoader();
        }
    }

    selectAreaBtn.addEventListener('click', enableAreaSelection);
    clearAreaBtn.addEventListener('click', clearArea);
    {% endif %}
</script>
</body>
</html>
